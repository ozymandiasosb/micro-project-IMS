<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Locations | IMS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="app-page">

<header class="app-topbar">
    <a class="topbar-back" href="dashboard.html">←</a>
    <span class="topbar-title">Locations</span>
    <span class="status-pill">IMS</span>
</header>

<main class="content-main">

    <section class="page-heading">
        <p class="eyebrow">WAREHOUSE SETUP</p>
        <h1>Warehouse locations</h1>
        <p class="subtitle">Create and manage warehouse areas, aisles and bins.</p>
    </section>

    <section class="content-card">
        <h2>Add a location</h2>

        <form id="locationForm" class="product-form">

            <label for="locationInput">Location name</label>
            <input id="locationInput"
                   placeholder="e.g. Main warehouse" required>

            <label for="locationNote">Description (optional)</label>
            <input id="locationNote"
                   placeholder="e.g. Ground floor storage">

            <button class="primary-button" type="submit">
                Save location
            </button>

            <p id="locationMessage" class="form-message" role="status"></p>
        </form>
    </section>

    <section class="content-card">
        <div class="section-heading">
            <h2>Saved locations</h2>
            <span id="locationCount">0 locations</span>
        </div>

        <div id="locationList" class="simple-list"></div>
    </section>

</main>

<nav class="bottom-nav">
    <a class="nav-item" href="dashboard.html"><span>▦</span>Dashboard</a>
    <a class="nav-item" href="search-inventory.html"><span>⌕</span>Search</a>
    <a class="nav-item" href="index.html"><span>⚙</span>Account</a>
    <a class="nav-item" href="manage-inventory.html"><span>◯</span>Inventory</a>
</nav>

<script src="script.js"></script>
</body>
</html>
